# ══════════════════════════════════════════════════════════════════════════════
# BookWorm E-Bookstore — Application Configuration
# ══════════════════════════════════════════════════════════════════════════════
#
# Sensitive values (marked with ${...}) must be supplied at runtime via:
#   • Environment variables   (recommended for production / containers)
#   • A local .env file       (loaded by your IDE or docker-compose)
#   • JVM -D system properties
#
# Required environment variables (see .env.example for a full template):
#   DB_USERNAME      — database user
#   DB_PASSWORD      — database password
#   JWT_SECRET       — HMAC-SHA256 signing key (≥ 32 chars)
#
# Optional overrides:
#   DB_HOST / DB_PORT / DB_NAME / SERVER_PORT / JWT_EXPIRATION_MS
# ══════════════════════════════════════════════════════════════════════════════

# ── Server ────────────────────────────────────────────────────────────────────
# Port the embedded Tomcat listens on.  Override with SERVER_PORT env var.
server.port=${SERVER_PORT:8080}

# Human-readable name used in logs, actuator info, and Spring Cloud registration.
spring.application.name=bookworm

# ── DataSource ────────────────────────────────────────────────────────────────
# JDBC URL for the PostgreSQL instance.
# Format: jdbc:postgresql://<host>:<port>/<database>[?param=value]
# HikariCP (the default pool) picks this up automatically.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bookworm}

# Database credentials — supplied at runtime via DB_USERNAME / DB_PASSWORD env vars.
# No defaults: the application will refuse to start if these are not set.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Explicit driver declaration (Spring Boot auto-detects from the URL,
# but stating it avoids ambiguity when multiple JDBC drivers are on the classpath).
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool ──────────────────────────────────────────────────
# Maximum number of connections the pool will maintain.
spring.datasource.hikari.maximum-pool-size=10
# Minimum idle connections kept alive.
spring.datasource.hikari.minimum-idle=2
# Max lifetime of a connection in the pool (ms).  Must be less than the
# PostgreSQL server's idle timeout (default 10 min = 600 000 ms).
spring.datasource.hikari.max-lifetime=540000
# Timeout for acquiring a connection from the pool (ms).
spring.datasource.hikari.connection-timeout=30000
# Validation query used to test a connection before handing it to the app.
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# Dialect: PostgreSQLDialect is the correct choice for Hibernate 6 (Spring Boot 3.x).
# Earlier Hibernate 5 used PostgreSQL95Dialect — do NOT use that here.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Schema management strategy:
#   validate — Hibernate checks that the DB schema matches the entities on startup
#              (correct for Flyway-managed schemas — Flyway owns the DDL, not Hibernate).
#   none      — use if you want zero schema involvement from Hibernate.
# Never set to create / create-drop / update in production.
spring.jpa.hibernate.ddl-auto=validate

# Disable the OSIV anti-pattern — keep JPA sessions scoped to the service layer.
spring.jpa.open-in-view=false

# SQL logging — enable only for local debugging; leave false in production.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Batch inserts/updates — improves bulk write performance with PostgreSQL.
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Flyway Database Migrations ────────────────────────────────────────────────
# Flyway owns the schema lifecycle; Hibernate only validates against it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Allow Flyway to stamp an existing schema so it doesn't try to re-run old migrations.
spring.flyway.baseline-on-migrate=true
# Flyway uses the same DataSource as JPA — no separate credentials needed.

# ── JWT Authentication ────────────────────────────────────────────────────────
# Secret used to sign HMAC-SHA256 tokens.
# MUST be at least 32 characters (256 bits).  Generate with:
#   openssl rand -base64 48
# Supplied at runtime via JWT_SECRET env var — no default, app will fail fast if unset.
app.jwt.secret=${JWT_SECRET}

# Token lifetime in milliseconds (default: 24 hours = 86 400 000 ms).
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Pagination Defaults ───────────────────────────────────────────────────────
# These are read by controllers as @RequestParam defaults; also useful for docs.
app.pagination.default-page-size=20
app.pagination.max-page-size=100
